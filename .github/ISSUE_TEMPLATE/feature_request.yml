name: "✨ Feature request"
description: Suggest an idea or improvement for DozeForge.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that DozeForge doesn't let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? How would it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

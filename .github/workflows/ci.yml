name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust: format, lint, unit tests across the three desktop targets ──────────
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # fmt & clippy are advisory during the beta (they don't fail the build yet)
      # so style/lint debt doesn't block releases. Tighten to hard gates post-1.0.
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt -- --check
        continue-on-error: true

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
        continue-on-error: true

      # Hard gate: unit + integration tests must pass.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets

  # ── Frontend: type-check + Vitest unit tests ─────────────────────────────────
  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # postinstall runs scripts/setup-scrcpy.mjs; on Linux it is a no-op and
      # never fails the install (see the script for details).
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: Vitest
        run: npm test

  # ── Android: smoke the ADB commands the app relies on, per API level ──────────
  android-emulator:
    name: Android API ${{ matrix.api }} smoke
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        api: [31, 33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ADB smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: |
            adb shell getprop ro.build.version.sdk
            adb shell dumpsys batterystats --checkin | head -n 20
            adb shell dumpsys alarm | head -n 40
            adb shell cmd appops get android | head -n 5

  # ── Build native installers for Windows, macOS and Linux ─────────────────────
  build:
    name: Build installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dozeforge-windows
            path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact: dozeforge-macos
            path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - os: ubuntu-22.04
            artifact: dozeforge-linux
            path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # npm ci runs postinstall -> fetches scrcpy on Windows (bundled into the
      # installer). On macOS/Linux it no-ops; scrcpy is resolved from PATH.
      - run: npm ci

      - name: Build (tauri)
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: warn

  # ── On a version tag, gather every OS installer into a GitHub Release ─────────
  release:
    name: Publish GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create / update the release (draft) with all installers
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          draft: true
          generate_release_notes: true
          name: DozeForge ${{ github.ref_name }}

[package]
name = "dozeforge"
version = "1.0.0"
description = "Surgical ADB battery and CPU auditor for Android 12+ with atomic rollback."
authors = ["DozeForge Contributors"]
edition = "2021"
rust-version = "1.79"

[lib]
name = "forgeandroid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"

# --- Async runtime ---
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Parsing ---
regex = "1.11"
once_cell = "1.20"

# --- Error handling ---
thiserror = "2.0"
anyhow = "1.0"

# --- Logging / telemetry ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# --- Time / hashing ---
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# --- Filesystem helpers ---
dirs = "5.0"
zip = "2.2.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
